<!DOCTYPE html>
<html lang="no" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clearfjord – Prisanalyse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300..700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<style>
:root,[data-theme="light"]{
  --bg:#f7f6f2;--surface:#f9f8f5;--surface-2:#ffffff;--surface-off:#edeae5;
  --border:rgba(40,37,29,0.11);--divider:#dcd9d5;
  --text:#28251d;--muted:#7a7974;--faint:#bab9b4;
  --primary:#01696f;--primary-h:#0c4e54;--primary-hi:#cedcd8;
  --up:#b33000;--down:#437a22;--neutral:#4a7fa5;
  --gold:#b07a00;--orange:#c85a00;--purple:#7a39bb;
  --sh-sm:0 1px 3px rgba(40,37,29,.07);--sh-md:0 4px 16px rgba(40,37,29,.09);
  --r-sm:.375rem;--r-md:.5rem;--r-lg:.75rem;--r-xl:1rem;
  --fd:"DM Serif Display",Georgia,serif;
  --fb:"DM Sans",system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#171614;--surface:#1c1b19;--surface-2:#222120;--surface-off:#252422;
  --border:rgba(255,255,255,.09);--divider:#262523;
  --text:#cdccca;--muted:#797876;--faint:#5a5957;
  --primary:#4f98a3;--primary-h:#227f8b;--primary-hi:#313b3b;
  --up:#e06030;--down:#6daa45;--neutral:#6fa8cc;
  --gold:#e8af34;--orange:#fdab43;--purple:#a86fdf;
  --sh-sm:0 1px 3px rgba(0,0,0,.25);--sh-md:0 4px 16px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{min-height:100dvh;font-family:var(--fb);font-size:clamp(1rem,.95rem + .25vw,1.125rem);
  color:var(--text);background:var(--bg);transition:background 200ms,color 200ms}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input{font:inherit;color:inherit}
p{max-width:68ch;line-height:1.75;text-wrap:pretty}
h1,h2,h3,h4{text-wrap:balance;line-height:1.2}

/* HEADER */
header{position:sticky;top:0;z-index:200;background:var(--surface);
  border-bottom:1px solid var(--border);box-shadow:var(--sh-sm);
  padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--text)}
.logo-name{font-family:var(--fd);font-size:clamp(1.1rem,1rem + .5vw,1.4rem)}
.logo-tag{font-size:.7rem;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:var(--surface-off);transition:background 180ms}
.icon-btn:hover{background:var(--divider)}

/* PRODUCT TABS */
.prod-bar{background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 1.5rem;display:flex;overflow-x:auto;scrollbar-width:none}
.prod-bar::-webkit-scrollbar{display:none}
.prod-tab{padding:.75rem 1.25rem;font-size:.875rem;font-weight:500;color:var(--muted);
  border-bottom:2px solid transparent;white-space:nowrap;
  transition:color 180ms,border-color 180ms;background:none;border-top:none;border-left:none;border-right:none}
.prod-tab:hover{color:var(--text)}
.prod-tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* SECTION TABS */
.sec-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:2rem}
.sec-tab{padding:.6rem 1.1rem;font-size:.875rem;font-weight:500;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color 180ms,border-color 180ms;background:none;border-top:none;border-left:none;border-right:none}
.sec-tab:hover{color:var(--text)}
.sec-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.sec-panel{display:none}.sec-panel.active{display:block}

main{max-width:1120px;margin:0 auto;padding:2rem 1.5rem}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:1.5rem;box-shadow:var(--sh-sm);margin-bottom:1.5rem}
.card-title{font-family:var(--fd);font-size:clamp(1.1rem,1rem + .5vw,1.4rem);margin-bottom:.25rem}
.card-sub{font-size:.8rem;color:var(--muted);margin-bottom:1.25rem}

/* KPI STRIP */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:1rem 1.25rem;box-shadow:var(--sh-sm)}
.kpi-l{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:.3rem}
.kpi-v{font-family:var(--fd);font-size:clamp(1.4rem,1.2rem + 1vw,2rem);line-height:1}
.kpi-s{font-size:.75rem;color:var(--muted);margin-top:.25rem}
.up{color:var(--up)}.dn{color:var(--down)}.neutral{color:var(--neutral)}

/* CONTROLS */
.ctrl-row{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;margin-bottom:1.5rem}
.field{display:flex;flex-direction:column;gap:.3rem}
label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
input[type="date"]{height:40px;padding:0 .75rem;border:1px solid var(--border);
  border-radius:var(--r-md);background:var(--surface-2);font-size:.875rem;
  transition:border-color 180ms}
input[type="date"]:focus{outline:none;border-color:var(--primary)}
.btn{height:40px;padding:0 1.25rem;background:var(--primary);color:#fff;
  border-radius:var(--r-md);font-size:.875rem;font-weight:600;transition:background 180ms}
.btn:hover{background:var(--primary-h)}

/* CHART */
.chart-wrap{position:relative}
.legend{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1rem}
.leg{display:flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--muted)}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* PRICE CALCULATOR */
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:start}
@media(max-width:640px){.calc-grid{grid-template-columns:1fr}}
.price-input-wrap{display:flex;gap:.75rem;align-items:center;margin-top:.75rem}
.price-input-wrap input[type="number"]{height:44px;padding:0 .75rem;border:1px solid var(--border);
  border-radius:var(--r-md);background:var(--surface-2);font-size:1rem;width:130px;
  transition:border-color 180ms}
.price-input-wrap input:focus{outline:none;border-color:var(--primary)}
.kr-label{font-size:.875rem;color:var(--muted)}

/* BREAKDOWN TABLE */
.breakdown-tbl{width:100%;border-collapse:collapse;margin-top:1rem;font-size:.9rem}
.breakdown-tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);padding:.5rem .75rem;border-bottom:2px solid var(--divider);font-weight:600}
.breakdown-tbl td{padding:.6rem .75rem;border-bottom:1px solid var(--border)}
.breakdown-tbl tr:last-child td{font-weight:700;border-bottom:none}
.bar-wrap{display:flex;align-items:center;gap:.5rem}
.bar-bg{flex:1;height:7px;background:var(--surface-off);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width 400ms ease}
.pct{font-size:.75rem;color:var(--muted);min-width:3rem;text-align:right;font-variant-numeric:tabular-nums}

/* ANALYSIS PROSE */
.prose{max-width:70ch}
.prose h2{font-family:var(--fd);font-size:clamp(1.4rem,1.2rem + 1vw,1.9rem);margin:2rem 0 .6rem}
.prose h3{font-family:var(--fd);font-size:1.2rem;margin:1.5rem 0 .5rem;color:var(--primary)}
.prose p{margin-bottom:1rem}
.callout{background:var(--primary-hi);border-left:3px solid var(--primary);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:1rem 1.25rem;margin:1.5rem 0}
.callout p{margin:0;font-style:italic}
.stat{font-family:var(--fd);font-size:1.4em;color:var(--primary)}
.big-compare{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin:1.5rem 0}
@media(max-width:640px){.big-compare{grid-template-columns:1fr}}
.compare-card{background:var(--surface-off);border-radius:var(--r-lg);padding:1.25rem;text-align:center}
.compare-card .flag{font-size:2rem;margin-bottom:.5rem}
.compare-card .price{font-family:var(--fd);font-size:2.5rem;line-height:1;margin:.25rem 0}
.compare-card .price-sub{font-size:.8rem;color:var(--muted)}
.compare-card.highlight{background:var(--primary-hi);border:1px solid var(--primary)}

/* METHOD */
.method-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem;margin-top:1.5rem}
.method-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.25rem}
.method-card h4{font-weight:700;margin-bottom:.5rem;font-size:.95rem}
.method-card p{font-size:.85rem;color:var(--muted);margin:0;max-width:none}
.source-list{list-style:none;margin-top:1rem}
.source-list li{font-size:.85rem;color:var(--muted);padding:.4rem 0;
  border-bottom:1px solid var(--border);display:flex;gap:.5rem}
.source-list li::before{content:"↗";color:var(--primary);flex-shrink:0}
.edit-note{background:var(--surface-off);border:1px dashed var(--divider);border-radius:var(--r-md);
  padding:.75rem 1rem;font-size:.8rem;color:var(--muted);margin-top:1rem;line-height:1.6}
.edit-note strong{color:var(--text)}

footer{text-align:center;padding:3rem 1.5rem;font-size:.8rem;color:var(--faint);
  border-top:1px solid var(--border);margin-top:3rem}

@media(max-width:640px){
  main{padding:1.25rem 1rem}
  header{padding:.75rem 1rem}
  .prod-bar{padding:0 1rem}
}
</style>
</head>
<body>
